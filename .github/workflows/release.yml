name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Build & Upload (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: i686-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build & Upload Binary Asset
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: winfetch
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build-msi:
    name: Build & Upload Windows MSI (x64)
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install WiX v5 Toolset
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and Package MSI
        shell: pwsh
        run: |
          ./packaging/windows/package.ps1 -Arch x64
      - name: Upload MSI to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*.msi
