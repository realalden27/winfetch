[package]
name = "winfetch"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A lightweight, zero-WMI system information tool for Windows written in Rust."
authors = ["RealAlden27 <324002681+realalden27@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/realalden27/winfetch"
homepage = "https://github.com/realalden27/winfetch"
documentation = "https://docs.rs/winfetch"
readme = "README.md"
keywords = ["windows", "neofetch", "fastfetch", "cli", "system-info"]
categories = ["command-line-utilities", "os::windows-apis"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
self-replace = "1.5"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
] }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
